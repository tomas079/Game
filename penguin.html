<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>펭귄 골인!</title>
<style>
  html,body{margin:0;height:100%;background:#0d1b2a;overflow:hidden;font-family:system-ui,"Malgun Gothic",sans-serif;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:100vw;height:auto;image-rendering:auto}
  #touch{position:fixed;left:0;right:0;bottom:12px;display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
  #touch .grp{display:flex;gap:12px;pointer-events:auto}
  #touch button{width:64px;height:64px;border-radius:50%;border:2px solid #ffffff88;background:#ffffff33;color:#fff;font-size:24px;touch-action:none}
  @media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="grp"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="grp"><button data-k="down">▼</button><button data-k="up">▲</button></div>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 440;
const LEVEL_END = 7700, GOAL_X = 7350;
const FLY_TIME = 4, STUN_TIME = 1.5, INV_AFTER = 1.0, FISH_RESPAWN = 5;

// ---------- 레벨 ----------
const solids = [
  {x:1500, y:GROUND-70,  w:90, h:70},
  {x:2700, y:GROUND-300, w:70, h:300},   // 빙벽 1 (날아서 넘기)
  {x:3600, y:GROUND-90,  w:80, h:90},
  {x:3780, y:GROUND-160, w:80, h:160},
  {x:4900, y:GROUND-320, w:80, h:320},   // 빙벽 2
  {x:6300, y:GROUND-110, w:100,h:110},
];
const spikeDefs = [[950,50],[1250,70],[1750,60],[2770,160],[3680,100],[4200,60],[4450,60],[4980,200],[5600,60],[6000,80],[6400,110],[6900,60]];
const snowDefs  = [[1900,2400,150],[4050,4700,190],[5300,5900,210],[6550,7150,230]];
const birdDefs  = [[2400,2650,190,140],[2850,3150,140,170],[4650,4880,170,150],[5050,5350,110,190],[5750,6100,250,200],[6650,7000,210,220]];
const fishDefs  = [[600,GROUND-140],[2450,GROUND-50],[3300,GROUND-200],[4600,GROUND-60],[5500,GROUND-180],[6200,GROUND-60]];

let spikes, snows, birds, fishes, p, camX, time, hits, state, particles, best;
try { best = parseFloat(localStorage.getItem('penguinBest')) || null; } catch(e){ best = null; }

function reset(){
  spikes = spikeDefs.map(([x,w]) => ({x, w}));
  snows  = snowDefs.map(([a,b,s]) => ({x:a, minX:a, maxX:b, r:24, dir:-1, speed:s, rot:0}));
  birds  = birdDefs.map(([a,b,y,s],i) => ({x:b, minX:a, maxX:b, baseY:y, y, dir:-1, speed:s, ph:i}));
  fishes = fishDefs.map(([x,y]) => ({x, y, alive:true, t:0}));
  p = {x:100, y:GROUND-48, w:34, h:48, vx:0, vy:0, onGround:true, facing:1, flyT:0, stunT:0, invT:0, anim:0};
  camX = 0; time = 0; hits = 0; particles = [];
}
reset();
state = 'title';

// ---------- 입력 ----------
const keys = {left:false,right:false,up:false,down:false};
let jumpBuf = 0;
const map = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',Space:'up',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown', e => {
  const k = map[e.code];
  if (k){ e.preventDefault(); if (k==='up' && !keys.up) jumpBuf = 0.15; keys[k] = true; }
  if (state !== 'play' && (e.code==='Enter' || e.code==='Space')) start();
  if (e.code === 'KeyR') start();
});
addEventListener('keyup', e => { const k = map[e.code]; if (k) keys[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (state!=='play'){ start(); return; } if (k==='up') jumpBuf=0.15; keys[k]=true; });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => b.addEventListener(ev, () => keys[k]=false));
});
cv.addEventListener('pointerdown', () => { if (state !== 'play') start(); });
function start(){ reset(); state = 'play'; initAudio(); }

// ---------- 사운드 ----------
let actx = null;
function initAudio(){ try { if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
function beep(f1, f2, dur, type='square', vol=0.08){
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);
}

// ---------- 유틸 ----------
const overlap = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
function burst(x, y, color, n, spd=4){
  for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*spd;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:0.6+Math.random()*0.4,color}); }
}

// ---------- 업데이트 ----------
function update(dt){
  const k = dt*60;
  time += dt;
  jumpBuf -= dt;

  // 장애물 이동
  for (const s of snows){
    s.x += s.dir*s.speed*dt; s.rot += s.dir*s.speed*dt/s.r;
    if (s.x < s.minX){ s.x = s.minX; s.dir = 1; } if (s.x > s.maxX){ s.x = s.maxX; s.dir = -1; }
  }
  for (const b of birds){
    b.x += b.dir*b.speed*dt; b.ph += dt;
    if (b.x < b.minX){ b.x = b.minX; b.dir = 1; } if (b.x > b.maxX){ b.x = b.maxX; b.dir = -1; }
    b.y = b.baseY + Math.sin(b.ph*2.5)*40;
  }
  for (const f of fishes){ f.t += dt; if (!f.alive && f.t > FISH_RESPAWN){ f.alive = true; f.t = 0; } }

  // 펭귄
  const flying = p.flyT > 0;
  if (p.stunT > 0){
    p.stunT -= dt;
    p.vx *= Math.pow(0.9, k);
    p.vy += 0.55*k;
  } else {
    const ax = (keys.right?1:0) - (keys.left?1:0);
    if (ax) p.facing = ax;
    const maxV = flying ? 7 : 5.5;
    p.vx += ax*0.7*k;
    p.vx *= Math.pow(ax ? 0.92 : 0.82, k);
    p.vx = Math.max(-maxV, Math.min(maxV, p.vx));
    if (flying){
      const target = ((keys.down?1:0) - (keys.up?1:0)) * 5.5;
      p.vy += (target - p.vy) * Math.min(1, 0.2*k);
      if (Math.random() < 0.5) particles.push({x:p.x+p.w/2-p.facing*14, y:p.y+p.h*0.6, vx:-p.facing*1.5, vy:Math.random()-0.5, life:0.4, color:'#ffe066'});
    } else {
      p.vy += 0.55*k;
      if (jumpBuf > 0 && p.onGround){ p.vy = -12; jumpBuf = 0; beep(400, 800, 0.12); }
      if (!keys.up && p.vy < -4) p.vy = -4; // 짧게 누르면 낮은 점프
    }
  }
  if (p.flyT > 0){ p.flyT -= dt; if (p.flyT <= 0) beep(600, 200, 0.25, 'triangle'); }
  if (p.invT > 0) p.invT -= dt;
  p.vy = Math.min(p.vy, 14);

  // X 이동 + 충돌
  p.x += p.vx*k;
  p.x = Math.max(0, Math.min(LEVEL_END - p.w, p.x));
  for (const s of solids) if (overlap(p, s)){
    if (p.vx > 0) p.x = s.x - p.w; else if (p.vx < 0) p.x = s.x + s.w;
    else p.x = (p.x + p.w/2 < s.x + s.w/2) ? s.x - p.w : s.x + s.w;
    p.vx = 0;
  }
  // Y 이동 + 충돌
  p.y += p.vy*k;
  p.onGround = false;
  if (p.y < 10){ p.y = 10; p.vy = 0; }
  if (p.y + p.h >= GROUND){ p.y = GROUND - p.h; p.vy = 0; p.onGround = true; }
  for (const s of solids) if (overlap(p, s)){
    if (p.vy > 0){ p.y = s.y - p.h; p.onGround = true; } else { p.y = s.y + s.h; }
    p.vy = 0;
  }
  if (p.onGround && Math.abs(p.vx) > 0.5) p.anim += dt*12;

  // 먹이
  for (const f of fishes) if (f.alive && overlap(p, {x:f.x-16, y:f.y-10, w:32, h:20})){
    f.alive = false; f.t = 0; p.flyT = FLY_TIME;
    burst(f.x, f.y, '#ffd166', 18, 5);
    beep(500, 1400, 0.25, 'triangle', 0.1);
  }

  // 위험물 충돌
  if (p.stunT <= 0 && p.invT <= 0){
    const hb = {x:p.x+4, y:p.y+4, w:p.w-8, h:p.h-6};
    let hit = null;
    for (const s of spikes){ const r = {x:s.x+4, y:GROUND-24, w:s.w-8, h:24}; if (overlap(hb, r)){ hit = r; break; } }
    if (!hit) for (const s of snows){ const r = {x:s.x-s.r*0.8, y:GROUND-s.r*1.8, w:s.r*1.6, h:s.r*1.6}; if (overlap(hb, r)){ hit = r; break; } }
    if (!hit) for (const b of birds){ const r = {x:b.x-18, y:b.y-8, w:36, h:16}; if (overlap(hb, r)){ hit = r; break; } }
    if (hit){
      hits++;
      p.stunT = STUN_TIME; p.invT = STUN_TIME + INV_AFTER;
      const dir = (p.x + p.w/2) < (hit.x + hit.w/2) ? -1 : 1;
      p.vx = dir*6; p.vy = -7;
      burst(p.x+p.w/2, p.y+p.h/2, '#ff6b6b', 14, 5);
      beep(300, 60, 0.35, 'sawtooth', 0.1);
    }
  }

  // 골인
  if (p.x + p.w/2 >= GOAL_X){
    state = 'clear';
    if (best === null || time < best){ best = time; try { localStorage.setItem('penguinBest', best); } catch(e){} }
    burst(GOAL_X, GROUND-120, '#ffd166', 50, 7);
    [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, f, 0.18, 'triangle', 0.1), i*120));
  }

  // 카메라
  const target = Math.max(0, Math.min(LEVEL_END - W, p.x - W*0.35));
  camX += (target - camX) * Math.min(1, 0.15*k);
}

function updateParticles(dt){
  const k = dt*60;
  for (const q of particles){ q.x += q.vx*k; q.y += q.vy*k; q.vy += 0.15*k; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
}

// ---------- 그리기 ----------
const flakes = Array.from({length:70}, () => ({x:Math.random()*W, y:Math.random()*H, s:1+Math.random()*2.5, v:20+Math.random()*40}));

function ell(x, y, rx, ry, rot=0){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI*2); ctx.fill(); }

function drawBackground(t, dt){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#7ec8f0'); g.addColorStop(1,'#d9f1ff');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff6c9'; ell(820, 90, 40, 40);
  // 산 (패럴랙스)
  const layers = [[0.15,'#b6d8ee',170,0.004],[0.35,'#9cc6e3',120,0.007]];
  for (const [par, col, amp, fq] of layers){
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x=0; x<=W; x+=8){
      const wx = x + camX*par;
      const y = GROUND - 60 - amp*(0.5+0.5*Math.sin(wx*fq)) * (0.6+0.4*Math.sin(wx*fq*2.3+1));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, GROUND); ctx.fill();
  }
  // 눈송이
  ctx.fillStyle = '#ffffffcc';
  for (const f of flakes){
    f.y += f.v*dt; f.x += Math.sin(t+f.s)*10*dt;
    if (f.y > H) { f.y = -5; f.x = Math.random()*W; }
    ell(((f.x - camX*0.5) % W + W) % W, f.y, f.s, f.s);
  }
}

function drawGround(){
  ctx.fillStyle = '#f4fbff'; ctx.fillRect(0, GROUND, W, H-GROUND);
  ctx.fillStyle = '#bfe3f7'; ctx.fillRect(0, GROUND, W, 6);
  ctx.fillStyle = '#e3f2fb';
  for (let x = -(camX % 120); x < W; x += 120) ell(x+40, GROUND+40, 30, 6);
}

function drawSolid(s){
  const x = s.x - camX;
  const g = ctx.createLinearGradient(x,0,x+s.w,0);
  g.addColorStop(0,'#a8dcf5'); g.addColorStop(1,'#6bb8e0');
  ctx.fillStyle = g; ctx.fillRect(x, s.y, s.w, s.h);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x-3, s.y-6, s.w+6, 10);
  ctx.strokeStyle = '#ffffff88'; ctx.lineWidth = 2;
  for (let y = s.y+30; y < s.y+s.h; y += 40){ ctx.beginPath(); ctx.moveTo(x+8, y); ctx.lineTo(x+s.w-12, y+8); ctx.stroke(); }
}

function drawSpike(s){
  const x = s.x - camX, n = Math.max(1, Math.round(s.w/20)), w = s.w/n;
  for (let i=0;i<n;i++){
    ctx.fillStyle = '#5fa8d3';
    ctx.beginPath(); ctx.moveTo(x+i*w, GROUND); ctx.lineTo(x+i*w+w/2, GROUND-28); ctx.lineTo(x+(i+1)*w, GROUND); ctx.fill();
    ctx.fillStyle = '#d6f0ff';
    ctx.beginPath(); ctx.moveTo(x+i*w+w/2, GROUND-28); ctx.lineTo(x+i*w+w/2+3, GROUND-4); ctx.lineTo(x+i*w+w/2-2, GROUND-4); ctx.fill();
  }
}

function drawSnow(s){
  const x = s.x - camX, y = GROUND - s.r;
  ctx.fillStyle = '#0002'; ell(x, GROUND-2, s.r, 5);
  ctx.fillStyle = '#ffffff'; ell(x, y, s.r, s.r);
  ctx.strokeStyle = '#b8d8ea'; ctx.lineWidth = 2;
  for (let i=0;i<3;i++){ const a = s.rot + i*2.1; ctx.beginPath(); ctx.arc(x+Math.cos(a)*s.r*0.45, y+Math.sin(a)*s.r*0.45, s.r*0.3, 0, Math.PI); ctx.stroke(); }
}

function drawBird(b, t){
  const x = b.x - camX, y = b.y, f = Math.sin(t*14 + b.ph)*10;
  ctx.save(); ctx.translate(x, y); ctx.scale(b.dir, 1);
  ctx.strokeStyle = '#6b7c8c'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-20, -f); ctx.quadraticCurveTo(-8, -6, 0, 0); ctx.quadraticCurveTo(8, -6, 20, -f); ctx.stroke();
  ctx.fillStyle = '#ffffff'; ell(0, 2, 14, 7);
  ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(21,3); ctx.lineTo(13,5); ctx.fill();
  ctx.fillStyle = '#222'; ell(9, 0, 1.6, 1.6);
  ctx.restore();
}

function drawFish(f, t){
  if (!f.alive) return;
  const x = f.x - camX, y = f.y + Math.sin(t*3 + f.x)*5;
  ctx.fillStyle = '#ffd16655'; ell(x, y, 26, 18);
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t*4)*0.15);
  ctx.fillStyle = '#ff8c42';
  ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-20,-8); ctx.lineTo(-20,8); ctx.fill();
  ctx.fillStyle = '#ffa94d'; ell(0, 0, 14, 8);
  ctx.fillStyle = '#fff'; ell(7, -2, 3, 3); ctx.fillStyle = '#222'; ell(8, -2, 1.5, 1.5);
  ctx.restore();
}

function drawGoal(t){
  const x = GOAL_X - camX;
  // 이글루
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x+120, GROUND, 80, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#cfe6f3'; ctx.lineWidth = 2;
  for (let r=1;r<4;r++){ ctx.beginPath(); ctx.arc(x+120, GROUND, 80, Math.PI + r*0.2, Math.PI + r*0.2 + 0.01); ctx.stroke(); }
  for (let yy = GROUND-25; yy > GROUND-80; yy -= 25){ ctx.beginPath(); const hw = Math.sqrt(80*80 - (GROUND-yy)**2); ctx.moveTo(x+120-hw, yy); ctx.lineTo(x+120+hw, yy); ctx.stroke(); }
  ctx.fillStyle = '#2b4a63'; ctx.beginPath(); ctx.arc(x+80, GROUND, 24, Math.PI, 0); ctx.fill();
  // 깃발
  ctx.fillStyle = '#8d6e63'; ctx.fillRect(x-3, GROUND-170, 6, 170);
  const wv = Math.sin(t*5)*6;
  ctx.fillStyle = '#ef476f';
  ctx.beginPath(); ctx.moveTo(x+3, GROUND-170); ctx.quadraticCurveTo(x+35, GROUND-165+wv, x+65, GROUND-150); ctx.quadraticCurveTo(x+35, GROUND-140+wv, x+3, GROUND-128); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui'; ctx.fillText('GOAL', x+12, GROUND-144);
}

function drawPenguin(t){
  if (p.invT > 0 && p.stunT <= 0 && Math.floor(t*15)%2) return;
  const flying = p.flyT > 0, stunned = p.stunT > 0;
  const cx = p.x + p.w/2 - camX, by = p.y + p.h;
  ctx.save(); ctx.translate(cx, by);
  if (!flying) { ctx.fillStyle = '#0002'; ell(0, (p.onGround?0:GROUND-by) - 1, 18, 4); }
  if (stunned) ctx.rotate(Math.sin(t*20)*0.12);
  else if (p.onGround && Math.abs(p.vx) > 0.5) ctx.rotate(Math.sin(p.anim)*0.12);
  else if (flying) ctx.rotate(p.facing*0.15);
  ctx.scale(p.facing, 1);

  // 발
  ctx.fillStyle = '#f39a1e';
  const step = p.onGround ? Math.sin(p.anim)*3 : 0;
  ell(-7, -2 + step, 8, 3.5); ell(8, -2 - step, 8, 3.5);
  // 날개 (뒤)
  ctx.fillStyle = '#152033';
  const wa = flying ? -0.9 + Math.sin(t*28)*0.9 : 0.25 + Math.sin(p.anim)*0.15;
  ctx.save(); ctx.translate(-12, -32); ctx.rotate(-wa); ell(-4, 12, 6, 15); ctx.restore();
  // 몸
  ctx.fillStyle = '#1f2a3d'; ell(0, -25, 18, 25);
  ctx.fillStyle = '#ffffff'; ell(4, -21, 11, 18);
  // 날개 (앞)
  ctx.fillStyle = '#152033';
  ctx.save(); ctx.translate(10, -32); ctx.rotate(wa); ell(2, 12, 6, 15); ctx.restore();
  // 볼
  ctx.fillStyle = '#ff9aa266'; ell(12, -32, 4, 2.5);
  // 눈
  if (stunned){
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(3,-42); ctx.lineTo(10,-35); ctx.moveTo(10,-42); ctx.lineTo(3,-35); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ell(7, -39, 4.5, 5);
    ctx.fillStyle = '#111'; ell(8.5, -39, 2.3, 2.8);
  }
  // 부리
  ctx.fillStyle = '#f39a1e';
  ctx.beginPath(); ctx.moveTo(13,-35); ctx.lineTo(24,-31); ctx.lineTo(13,-28); ctx.fill();
  ctx.restore();

  // 기절 별
  if (stunned){
    for (let i=0;i<3;i++){
      const a = t*6 + i*Math.PI*2/3;
      drawStar(cx + Math.cos(a)*20, p.y - 8 + Math.sin(a)*6, 6, '#ffd166');
    }
  }
  // 비행 게이지
  if (flying){
    const w = 44, r = p.flyT / FLY_TIME;
    ctx.fillStyle = '#0005'; ctx.fillRect(cx - w/2, p.y - 18, w, 6);
    ctx.fillStyle = r < 0.3 ? '#ff6b6b' : '#ffd166'; ctx.fillRect(cx - w/2, p.y - 18, w*r, 6);
  }
}

function drawStar(x, y, r, col){
  ctx.fillStyle = col; ctx.beginPath();
  for (let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r*0.45 : r; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  ctx.fill();
}

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

function drawHUD(){
  ctx.fillStyle = '#0d1b2acc'; roundRect(16, 14, 330, 62, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui';
  ctx.fillText(`⏱ ${time.toFixed(1)}초`, 30, 40);
  ctx.fillText(`💫 충돌 ${hits}`, 150, 40);
  if (p.flyT > 0){ ctx.fillStyle = '#ffd166'; ctx.fillText(`🐟 비행 ${p.flyT.toFixed(1)}`, 245, 40); }
  // 진행도
  const r = Math.min(1, (p.x + p.w/2) / GOAL_X);
  ctx.fillStyle = '#ffffff33'; roundRect(30, 54, 300, 8, 4); ctx.fill();
  ctx.fillStyle = '#4cc9f0'; roundRect(30, 54, 300*r, 8, 4); ctx.fill();
  ctx.fillStyle = '#ef476f'; ctx.fillRect(326, 50, 4, 16);
}

function overlay(title, lines, sub){
  ctx.fillStyle = '#0d1b2abb'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 56px system-ui'; ctx.fillText(title, W/2, 170);
  ctx.font = '22px system-ui';
  lines.forEach((l,i) => { ctx.fillStyle = l.c || '#e0f2ff'; ctx.fillText(l.t, W/2, 240 + i*36); });
  ctx.fillStyle = '#ffd166'; ctx.font = 'bold 24px system-ui';
  if (Math.floor(performance.now()/500)%2) ctx.fillText(sub, W/2, 470);
  ctx.textAlign = 'left';
}

// ---------- 루프 ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const t = now/1000;
  if (state === 'play') update(dt);
  updateParticles(dt);

  drawBackground(t, dt);
  drawGround();
  const vis = o => o.x + (o.w||40) > camX - 60 && o.x - 60 < camX + W;
  solids.filter(vis).forEach(drawSolid);
  spikes.filter(vis).forEach(drawSpike);
  drawGoal(t);
  fishes.filter(vis).forEach(f => drawFish(f, t));
  snows.filter(vis).forEach(drawSnow);
  birds.filter(vis).forEach(b => drawBird(b, t));
  drawPenguin(t);
  for (const q of particles){ ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.color; ell(q.x - camX, q.y, 3, 3); }
  ctx.globalAlpha = 1;

  if (state === 'play') drawHUD();
  if (state === 'title'){
    overlay('🐧 펭귄 골인!', [
      {t:'장애물을 피해 깃발까지 달려가세요!'},
      {t:'←  →  이동     ↑ / Space  점프'},
      {t:'🐟 물고기를 먹으면 4초 동안 날 수 있어요 (↑ ↓ 로 상하 이동)', c:'#ffd166'},
      {t:'💫 장애물에 부딪히면 잠시 기절해서 움직일 수 없어요', c:'#ff9aa2'},
    ], 'Enter / Space / 터치로 시작');
  }
  if (state === 'clear'){
    const score = time + hits*3;
    const stars = score < 45 ? '★★★' : score < 70 ? '★★☆' : '★☆☆';
    overlay('🎉 골인!', [
      {t:stars, c:'#ffd166'},
      {t:`기록 ${time.toFixed(2)}초   ·   충돌 ${hits}회`},
      {t:`최고 기록 ${best !== null ? best.toFixed(2)+'초' : '-'}`, c:'#9be7ff'},
    ], 'Enter / Space / 터치로 다시 하기');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
